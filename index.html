<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sombras da República: A Trindade Filosófica</title>
    <link rel="stylesheet" href="styles/index.css">
</head>
<body>

    <div id="lobby-screen">
        <div class="lobby-container">
            <h1>Sombras da República</h1>
            <p>Escolha o seu papel na sessão de RPG:</p>
            <div class="lobby-buttons">
                <button class="lobby-btn player" onclick="escolherPapel('jogador')">👤 Entrar como Jogador</button>
                <button class="lobby-btn mestre" onclick="escolherPapel('mestre')">👑 Entrar como Mestre</button>
            </div>
        </div>
    </div>

    <div id="stats-panel">
        <div class="stat-box" id="tag-fase">Fase: <span>O Tabuleiro</span></div>
        <div class="stat-box" id="tag-filosofia">Essência: <span>Observador</span></div>
        <div class="stat-box">🌐 Online: <span id="online-count">0</span></div>
        <button id="progression-map" class="map-btn pulse-animation" onclick="openMap()">🗺️ Ver Mapa</button>
    </div>

    <div id="game-container">
        <h1>Sombras da República</h1>
        
        <div id="story-area"></div>

        <div id="choices" class="choices-container"></div>
    </div>

    <div id="map-modal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-button" onclick="closeMap()">&times;</span>
            <h2>Mapa Tático Regional</h2>
            <div class="map-wrapper">
                <img src="images/mapa.jpg" alt="Mapa Tático" class="tactical-map">
                <div id="player-marker" class="map-marker"></div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="scripts/script.js"></script>
</body>
</html>
